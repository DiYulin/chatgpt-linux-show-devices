name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Synthetic archive tests
        run: python3 -m unittest discover -s tests -v
      - name: Build Debian package
        run: python3 scripts/build_deb.py
      - name: Verify package contents
        run: python3 scripts/verify_package.py dist/chatgpt-show-other-devices_1.0.1_all.deb
      - name: Install, trigger, and purge on a clean runner
        run: sh scripts/test_package_ci.sh dist/chatgpt-show-other-devices_1.0.1_all.deb
